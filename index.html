<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WristLab: D Watch 7 decoded</title>
  <meta name="description" content="A reverse-engineered studio for the D Watch 7 smartwatch: live telemetry over BLE, a protocol lab, 20 browser games, and the decoding notes.">
  <meta name="theme-color" content="#0d0f12">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://use.fontawesome.com">
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Bungee&family=Chivo:wght@400;700;900&family=Silkscreen:wght@400;700&display=swap" rel="preload" as="style">
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Bungee&family=Chivo:wght@400;700;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600&family=Atkinson+Hyperlegible+Mono:wght@400;500&family=Bungee&family=Chivo:wght@400;700;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="themes/arcade/tokens.css">
  <link rel="stylesheet" href="themes/arcade/arcade.css">
  <script src="https://use.fontawesome.com/releases/v5.15.4/js/all.js" defer></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="app">
    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">
      <a class="brand" href="#/dashboard" aria-label="WristLab home">
        <span class="brand-mark">
          <i class="fas fa-stopwatch" aria-hidden="true"></i>
        </span>
        <span class="brand-text">
          <b>WristLab</b>
          <small>D Watch 7 studio</small>
        </span>
      </a>

      <nav class="nav" id="nav">
        <div class="nav-label">Workspace</div>
        <a href="#/dashboard" data-nav="dashboard">
          <i class="fas fa-th-large" aria-hidden="true"></i>
          <span>Dashboard</span>
        </a>
        <a href="#/arcade" data-nav="arcade">
          <i class="fas fa-gamepad" aria-hidden="true"></i>
          <span>Arcade</span>
          <span class="nav-count" id="navCount">20</span>
        </a>
        <a href="#/lab" data-nav="lab">
          <i class="fas fa-flask" aria-hidden="true"></i>
          <span>Protocol lab</span>
        </a>
        <a href="#/story" data-nav="story">
          <i class="fas fa-book-open" aria-hidden="true"></i>
          <span>The decode</span>
        </a>
        <a href="#/manage" data-nav="manage">
          <i class="fas fa-sliders-h" aria-hidden="true"></i>
          <span>Manage</span>
        </a>
      </nav>

      <div class="side-foot">
        <div class="bridge-mini" id="sideBridge">
          <div class="row"><span class="dot"></span><span id="sideBridgeText">Bridge offline</span></div>
          <small id="sideBridgeHint">Start <b>start.bat</b> to link the watch.</small>
        </div>
        <div class="side-ver"><span>v1.0.0</span><span>MIT</span></div>
      </div>
    </aside>

    <!-- ================= MAIN ================= -->
    <div class="main">
      <header class="topbar">
        <div class="crumb">
          <span class="c1">WristLab</span>
          <span class="sep">/</span>
          <b id="crumb">Dashboard</b>
        </div>
        <div class="top-actions">
          <button class="cmd-btn" id="cmdOpen" title="Command palette (Ctrl/Cmd + K)">
            <i class="fas fa-search" aria-hidden="true"></i>
            <span>Command</span><kbd>Ctrl K</kbd>
          </button>
          <div class="watch-chip" id="watchChip" title="Watch bridge status">
            <span class="dot"></span>
            <span id="watchChipText">Bridge offline</span>
            <b class="bat" id="batteryChip">--%</b>
          </div>
          <button class="icon-btn" id="soundBtn" title="Toggle UI sound" aria-label="Toggle UI sound">
            <i class="fas fa-volume-up" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="view" id="view" aria-live="polite"></main>
    </div>
  </div>

  <!-- ================= GAME MODAL ================= -->
  <div class="modal" id="gameModal" aria-hidden="true">
    <div class="modal-backdrop" data-close="game"></div>
    <div class="modal-shell">
      <div class="modal-head">
        <div class="mt">
          <span class="mi" id="gmIcon" aria-hidden="true"></span>
          <div>
            <b id="gmTitle">Game</b>
            <span id="gmSub">WristLab arcade</span>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary btn-sm" id="gmOpenTab"><i class="fas fa-external-link-alt" aria-hidden="true"></i> New tab</button>
          <button class="icon-btn" data-close="game" title="Close (Esc)">
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <div class="modal-body"><iframe id="gmFrame" title="Game" allow="autoplay; fullscreen"></iframe></div>
    </div>
  </div>

  <!-- ================= COMMAND PALETTE ================= -->
  <div class="palette" id="palette" aria-hidden="true">
    <div class="pb" data-close="palette"></div>
    <div class="ps">
      <div class="pi">
        <i class="fas fa-search" aria-hidden="true"></i>
        <input id="paletteInput" placeholder="Jump to a page, launch a game, fire a haptic…" autocomplete="off">
        <kbd>ESC</kbd>
      </div>
      <div class="pl" id="paletteList"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="games/registry.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
