<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Rhythm Grid · WristLab Arcade</title>
</head>
<body>
<script src="./engine.js"></script>
<script>
(function () {
  'use strict';

  const W = 960, H = 600;
  const PLAY_X = 250, LANE_W = 115, LANES = 4, PLAY_W = LANE_W * LANES;
  const TOP = 92, HIT_Y = 498;
  const APPROACH = 1.75;
  const BPM = 120, BEAT = 60 / BPM, TRACK_LEN = 60;
  const MONO = "'IBM Plex Mono',monospace";
  const COLORS = ['#f472b6', '#c084fc', '#38bdf8', '#fbbf24'];
  const RGB = ['244,114,182', '192,132,252', '56,189,248', '251,191,36'];
  const FREQ = [293.66, 349.23, 392.00, 440.00];
  const KEY_LABELS = ['D', 'F', 'J', 'K'];

  function laneX(i) { return PLAY_X + i * LANE_W + LANE_W / 2; }

  function installHelpers(g) {
    if (typeof g.clamp !== 'function') g.clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    if (typeof g.lerp !== 'function') g.lerp = (a, b, t) => a + (b - a) * t;
    if (typeof g.rand !== 'function') g.rand = (a = 0, b = 1) => a + Math.random() * (b - a);
    if (typeof g.randInt !== 'function') g.randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
    if (typeof g.pick !== 'function') g.pick = arr => arr[Math.floor(Math.random() * arr.length)];
    if (typeof g.dist !== 'function') g.dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
    if (typeof g.angle !== 'function') g.angle = (x1, y1, x2, y2) => Math.atan2(y2 - y1, x2 - x1);
  }

  function addNote(notes, t, lane) {
    notes.push({ t: t, lane: lane, hit: false, dead: false });
  }

  function buildChart(g) {
    const notes = [];
    const last = [0, 0, 0, 0];
    let lastAny = 0;
    let t = 2.0;
    while (t < 57.4) {
      const phase = t < 15 ? 0 : t < 30 ? 1 : t < 45 ? 2 : 3;
      const b = t / BEAT;
      const onBeat = Math.abs(b - Math.round(b)) < 0.01;
      const p = 0.20 + phase * 0.10 + (onBeat ? 0.40 : 0);
      if (Math.random() < p) {
        let lane = g.randInt(0, 3);
        let guard = 0;
        while (t - last[lane] < 0.26 && guard++ < 10) lane = g.randInt(0, 3);
        addNote(notes, t, lane); last[lane] = t; lastAny = t;

        if (phase >= 1 && Math.random() < 0.08 + phase * 0.02) {
          const l2 = (lane + g.randInt(1, 3)) % 4;
          addNote(notes, t, l2); last[l2] = t;
        }
        if (phase >= 2 && Math.random() < 0.14 && t + 0.125 < 57.4) {
          const l3 = (lane + g.randInt(1, 3)) % 4;
          if (t + 0.125 - last[l3] > 0.13) {
            addNote(notes, t + 0.125, l3); last[l3] = t + 0.125;
          }
        }
      }
      if (t - lastAny > 2.4) {
        const lane = g.randInt(0, 3);
        addNote(notes, t, lane); last[lane] = t; lastAny = t;
      }
      t += 0.25;
    }
    notes.sort((a, b) => (a.t - b.t) || (a.lane - b.lane));
    g.notes = notes;
  }

  function bindLaneKeys(g) {
    if (g._laneKeysBound) return;
    g._laneKeysBound = true;
    const map = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };
    window.addEventListener('keydown', e => {
      const lane = map[e.code];
      if (lane == null) return;
      if (e.repeat) { e.preventDefault(); return; }
      if (g.state !== 'running') return;
      e.preventDefault();
      if (e.code === 'KeyD') g._swallowRight = true;
      if (e.code === 'KeyJ') g._swallowAction = true;
      laneHit(g, lane);
    }, true);
  }

  function missNote(g, n) {
    if (n.dead || n.hit) return;
    n.dead = true;
    g.judged++;
    g.stats.miss++;
    g.combo = 0;
    g.mult = 1;
    g.comboPulse = 0;
    g.health = Math.max(0, g.health - 7);
    g.judges.push({ text: 'MISS', color: '#fb7185', x: laneX(n.lane), y: HIT_Y - 66, t: 0, life: 0.7 });
    if (g.judges.length > 7) g.judges.shift();
    g.audio.tone(155, 0.18, 'sawtooth', 0.10, { slide: 68 });
    g.shake(2.5, 0.16);
    if (g.health <= 0) finish(g, true);
  }

  function laneHit(g, lane) {
    if (!g || g.done) return;
    g.laneFlash[lane] = 1;

    let best = null, bestD = 1e9;
    for (let i = 0; i < g.notes.length; i++) {
      const n = g.notes[i];
      if (n.lane !== lane || n.hit || n.dead) continue;
      const d = Math.abs(n.t - g.time);
      if (d < bestD && d <= 0.19) { best = n; bestD = d; }
      if (n.t > g.time + 0.35) break;
    }

    if (!best) {
      g.audio.tone(170, 0.045, 'square', 0.04);
      return;
    }

    best.hit = true;
    const grade = bestD <= 0.055 ? 'perfect' : bestD <= 0.105 ? 'great' : 'good';
    const base = grade === 'perfect' ? 120 : grade === 'great' ? 80 : 45;
    const col = grade === 'perfect' ? '#fef08a' : grade === 'great' ? '#f472b6' : '#38bdf8';
    const label = grade === 'perfect' ? 'PERFECT' : grade === 'great' ? 'GREAT' : 'GOOD';

    g.judged++;
    g.stats[grade]++;
    g.combo++;
    g.maxCombo = Math.max(g.maxCombo, g.combo);
    g.comboPulse = 1;
    g.mult = Math.min(8, 1 + Math.floor(g.combo / 10));
    g.addScore(base * g.mult);
    g.health = Math.min(100, g.health + (grade === 'perfect' ? 1.8 : grade === 'great' ? 1.2 : 0.7));

    g.judges.push({ text: label, color: col, x: laneX(lane), y: HIT_Y - 66, t: 0, life: 0.68 });
    if (g.judges.length > 7) g.judges.shift();

    const lx = laneX(lane);
    g.burst(lx, HIT_Y - 10, COLORS[lane], grade === 'perfect' ? 20 : 11,
      { speed: 230, life: 0.65, size: 3, angle: -Math.PI / 2, spread: 2.2, gravity: 120 });
    if (grade === 'perfect') g.burst(lx, HIT_Y - 10, '#ffffff', 8, { speed: 170, life: 0.5, size: 2 });

    g.audio.tone(FREQ[lane], 0.12, 'triangle', 0.14);
    if (grade === 'perfect') g.audio.tone(FREQ[lane] * 2, 0.1, 'sine', 0.07, { delay: 0.03 });
    g.haptic('tick');

    if (g.combo % 10 === 0) {
      g.audio.tone(FREQ[lane] * 1.5, 0.2, 'triangle', 0.12);
      g.audio.tone(FREQ[lane] * 2, 0.24, 'sine', 0.08, { delay: 0.06 });
      g.haptic('coin');
      g.burst(lx, HIT_Y - 16, '#ffffff', 26, { speed: 300, life: 0.85, size: 3, spread: 6.28 });
      g.burst(lx, HIT_Y - 16, COLORS[lane], 20, { speed: 220, life: 0.7, size: 3, spread: 6.28 });
    }
  }

  function finish(g, failed) {
    if (g.done) return;
    g.done = true;
    g.endT = failed ? 0.7 : 1.1;
    g.audio.stopMusic();
    const total = Math.max(1, g.judged);
    const acc = (g.stats.perfect + g.stats.great * 0.7 + g.stats.good * 0.35) / total * 100;
    if (!failed) {
      g.addScore(Math.round(400 + g.health * 4 + acc * 8));
      g.audio.sfx('win');
    }
    g.detail = (failed ? 'Track failed' : 'Track clear') + ' · ' + acc.toFixed(1) + '% · ' +
      g.stats.perfect + ' perfect · max combo ' + g.maxCombo;
  }

  WristGame.mount({
    id: 'rhythm-grid',
    title: 'Rhythm Grid',
    tagline: 'Four lanes. One pulse.',
    category: 'Rhythm',
    accent: '#f472b6',
    bg: '#0d050b',
    controls: [
      { keys: 'D F J K', label: 'LANES' },
      { keys: '← ↑ ↓ →', label: 'LANES' },
      { keys: 'WATCH', label: 'LEFT / ACTION / RIGHT' }
    ],
    tips: [
      'Tap the lane as the tile crosses the bright hit line.',
      'Perfect hits feed your combo; every 10 combo raises the multiplier.',
      'A full 60-second track. Misses drain the sync bar — keep it alive.'
    ],

    init(g) {
      installHelpers(g);
      g.score = 0;
      g.health = 100;
      g.combo = 0;
      g.maxCombo = 0;
      g.comboPulse = 0;
      g.mult = 1;
      g.judged = 0;
      g.stats = { perfect: 0, great: 0, good: 0, miss: 0 };
      g.laneFlash = [0, 0, 0, 0];
      g.judges = [];
      g.missPtr = 0;
      g.done = false;
      g.endT = 0;
      g.detail = '';
      g._swallowRight = false;
      g._swallowAction = false;
      buildChart(g);
      bindLaneKeys(g);
      g.audio.stopMusic();
    },

    onStart(g) {
      g.audio.startMusic({ root: 146.83, bpm: BPM, scale: [0, 3, 5, 7, 10], wave: 'triangle', gain: 0.038 });
    },

    onAction(g, action, down) {
      if (!down) return;
      if (action === 'right') {
        if (g._swallowRight) { g._swallowRight = false; return; }
        laneHit(g, 3);
      } else if (action === 'action') {
        if (g._swallowAction) { g._swallowAction = false; return; }
        laneHit(g, 1);
      } else if (action === 'left') {
        laneHit(g, 0);
      } else if (action === 'up') {
        laneHit(g, 1);
      } else if (action === 'down') {
        laneHit(g, 2);
      }
    },

    onPointer(g, x, y, type) {
      if (type !== 'down' || g.done) return;
      if (y < TOP - 20 || y > HIT_Y + 44) return;
      const lane = Math.floor((x - PLAY_X) / LANE_W);
      if (lane >= 0 && lane < LANES) laneHit(g, lane);
    },

    update(g, dt) {
      if (g.done) {
        g.endT -= dt;
        if (g.endT <= 0) g.over(g.detail);
        return;
      }

      for (let i = 0; i < LANES; i++) g.laneFlash[i] = Math.max(0, g.laneFlash[i] - dt * 5);
      g.comboPulse = Math.max(0, g.comboPulse - dt * 3.2);

      for (let i = g.judges.length - 1; i >= 0; i--) {
        const j = g.judges[i];
        j.t += dt;
        if (j.t > j.life) g.judges.splice(i, 1);
      }

      while (g.missPtr < g.notes.length) {
        const n = g.notes[g.missPtr];
        if (n.t + 0.19 > g.time) break;
        g.missPtr++;
        if (!n.hit) missNote(g, n);
        if (g.done) return;
      }

      if (g.time >= TRACK_LEN) finish(g, false);
    },

    draw(g, ctx) {
      const t = g.time;
      g.clear('#0d050b');

      const bg = ctx.createRadialGradient(480, 30, 30, 480, 330, 730);
      bg.addColorStop(0, 'rgba(150,40,100,.30)');
      bg.addColorStop(0.5, 'rgba(60,12,40,.15)');
      bg.addColorStop(1, 'rgba(13,5,11,0)');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

      g.grid('rgba(244,114,182,.032)', 48);

      // Ambient equalizer behind everything
      for (let i = 0; i < 32; i++) {
        const energy = Math.abs(Math.sin(t * 2.2 + i * 0.55)) * 0.6 + Math.abs(Math.sin(t * 4.7 + i * 1.7)) * 0.4;
        const bh = 6 + energy * 44 + g.laneFlash[i % 4] * 26;
        ctx.globalAlpha = 0.07 + energy * 0.06;
        g.roundRect(18 + i * 29, 598 - bh, 17, bh, 4, COLORS[i % 4]);
      }
      ctx.globalAlpha = 1;

      // Faint concentric score rings
      ctx.save();
      ctx.globalAlpha = 0.09;
      ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 1;
      for (let r = 150; r <= 470; r += 62) {
        ctx.beginPath(); ctx.arc(480, 300, r + Math.sin(t * 0.6) * 4, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();

      // Lane beds
      for (let i = 0; i < LANES; i++) {
        const x = PLAY_X + i * LANE_W;
        const fl = g.laneFlash[i];
        const grd = ctx.createLinearGradient(0, TOP, 0, HIT_Y + 46);
        grd.addColorStop(0, 'rgba(' + RGB[i] + ',0.012)');
        grd.addColorStop(1, 'rgba(' + RGB[i] + ',' + (0.05 + fl * 0.20) + ')');
        ctx.fillStyle = grd;
        ctx.fillRect(x, TOP, LANE_W, HIT_Y + 46 - TOP);
      }
      ctx.save();
      ctx.strokeStyle = 'rgba(244,114,182,.10)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= LANES; i++) {
        const x = PLAY_X + i * LANE_W;
        ctx.beginPath(); ctx.moveTo(x, TOP); ctx.lineTo(x, HIT_Y + 46); ctx.stroke();
      }
      ctx.restore();

      // Notes
      for (let i = 0; i < g.notes.length; i++) {
        const n = g.notes[i];
        if (n.hit || n.dead) continue;
        const dtn = n.t - t;
        if (dtn > APPROACH || dtn < -0.20) continue;
        const y = HIT_Y - (dtn / APPROACH) * (HIT_Y - TOP);
        const x = PLAY_X + n.lane * LANE_W + 15;
        const nw = LANE_W - 30, nh = 20;
        ctx.save();
        ctx.shadowColor = COLORS[n.lane];
        ctx.shadowBlur = 16;
        g.roundRect(x, y - nh / 2, nw, nh, 8, COLORS[n.lane]);
        ctx.restore();
        g.roundRect(x + 4, y - nh / 2 + 3, nw - 8, 3, 1.5, 'rgba(255,255,255,.55)');
        g.roundRect(x + nw - 27, y - 2, 15, 4, 2, 'rgba(255,255,255,.35)');
      }

      // Spawn fade mask
      const mask = ctx.createLinearGradient(0, TOP - 24, 0, TOP + 64);
      mask.addColorStop(0, '#0d050b');
      mask.addColorStop(0.55, 'rgba(13,5,11,.88)');
      mask.addColorStop(1, 'rgba(13,5,11,0)');
      ctx.fillStyle = mask;
      ctx.fillRect(PLAY_X, TOP - 24, PLAY_W, 88);

      // Hit line
      const bt = (t % BEAT) / BEAT;
      const pulse = Math.pow(1 - bt, 5);
      const hg = ctx.createLinearGradient(0, HIT_Y, 0, HIT_Y + 44);
      hg.addColorStop(0, 'rgba(244,114,182,' + (0.10 + pulse * 0.12) + ')');
      hg.addColorStop(1, 'rgba(244,114,182,0)');
      ctx.fillStyle = hg; ctx.fillRect(PLAY_X, HIT_Y, PLAY_W, 44);
      ctx.save();
      ctx.shadowColor = '#f472b6';
      ctx.shadowBlur = 16 + pulse * 20;
      g.roundRect(PLAY_X - 6, HIT_Y - 2, PLAY_W + 12, 4 + pulse * 3, 3, 'rgba(255,228,242,.92)');
      ctx.restore();

      for (let i = 0; i < LANES; i++) {
        const fl = g.laneFlash[i];
        if (fl > 0.02) {
          ctx.save();
          ctx.globalAlpha = fl;
          g.circle(laneX(i), HIT_Y, 11 + fl * 24, null, COLORS[i], 2);
          ctx.globalAlpha = fl * 0.9;
          g.glow(laneX(i), HIT_Y, 8 + fl * 8, COLORS[i], 22);
          ctx.restore();
        }
      }

      // Key hints
      for (let i = 0; i < LANES; i++) {
        const x = laneX(i), y = 574;
        const fl = g.laneFlash[i];
        g.roundRect(x - 21, y - 17, 42, 33, 8, 'rgba(255,255,255,.035)',
          'rgba(' + RGB[i] + ',' + (0.22 + fl * 0.55) + ')', 1);
        g.text(KEY_LABELS[i], x, y + 6, {
          size: 15, align: 'center', color: fl > 0.12 ? COLORS[i] : 'rgba(255,255,255,.58)', font: MONO
        });
      }

      // Top HUD
      g.text('SYNC', 34, 41, { size: 9, color: '#a58a9e', font: MONO });
      g.roundRect(82, 28, 470, 14, 7, 'rgba(255,255,255,.06)');
      if (g.health > 0) {
        const hpg = ctx.createLinearGradient(82, 0, 552, 0);
        hpg.addColorStop(0, '#fb7185');
        hpg.addColorStop(0.5, '#f472b6');
        hpg.addColorStop(1, '#c084fc');
        ctx.save();
        ctx.shadowColor = g.health < 30 ? '#fb7185' : '#f472b6';
        ctx.shadowBlur = g.health < 30 ? 18 : 7;
        g.roundRect(82, 28, 470 * g.health / 100, 14, 7, hpg);
        ctx.restore();
      }
      g.text(Math.round(g.health) + '%', 566, 42, { size: 11, color: '#f4d9e6', font: MONO });

      const secs = Math.max(0, TRACK_LEN - t);
      g.text('TRACK', 926, 24, { size: 9, align: 'right', color: '#8a7280', font: MONO });
      g.text('0:' + String(Math.floor(secs % 60)).padStart(2, '0'), 926, 46,
        { size: 22, align: 'right', color: '#f4f1e8', font: MONO });

      g.roundRect(34, 58, 892, 3, 2, 'rgba(255,255,255,.06)');
      g.roundRect(34, 58, 892 * Math.min(1, t / TRACK_LEN), 3, 2, 'rgba(244,114,182,.55)');

      // Combo panel
      g.text('COMBO', 130, 176, { size: 9, align: 'center', color: '#8a7280', font: MONO });
      const cs = 1 + Math.min(0.30, g.comboPulse * 0.30);
      ctx.save();
      ctx.translate(130, 252);
      ctx.scale(cs, cs);
      g.text(String(g.combo), 0, 0, {
        size: 64, align: 'center', font: MONO,
        color: g.combo > 0 ? '#f4f1e8' : 'rgba(255,255,255,.22)',
        glow: g.combo >= 10 ? '#f472b6' : null, blur: 20
      });
      ctx.restore();
      g.text('MULTIPLIER', 130, 296, { size: 9, align: 'center', color: '#8a7280', font: MONO });
      g.text('x' + g.mult, 130, 334, {
        size: 25, align: 'center', color: g.mult > 1 ? '#f472b6' : '#8a7280',
        font: MONO, glow: g.mult > 1 ? '#f472b6' : null, blur: 14
      });
      g.text('MAX ' + g.maxCombo, 130, 372, { size: 9, align: 'center', color: '#6f5a68', font: MONO });

      // Accuracy panel
      const judged = Math.max(1, g.judged);
      const acc = (g.stats.perfect + g.stats.great * 0.7 + g.stats.good * 0.35) / judged * 100;
      g.text('ACCURACY', 830, 122, { size: 9, align: 'center', color: '#8a7280', font: MONO });
      g.text(acc.toFixed(1) + '%', 830, 156, {
        size: 28, align: 'center', color: '#f4f1e8', font: MONO, glow: '#f472b6', blur: 12
      });
      const rows = [
        ['PERFECT', g.stats.perfect, '#fef08a'],
        ['GREAT', g.stats.great, '#f472b6'],
        ['GOOD', g.stats.good, '#38bdf8'],
        ['MISS', g.stats.miss, '#fb7185']
      ];
      for (let i = 0; i < rows.length; i++) {
        const yy = 208 + i * 32;
        g.text(rows[i][0], 762, yy, { size: 10, color: '#8a7280', font: MONO });
        g.text(String(rows[i][1]), 900, yy, { size: 12, align: 'right', color: rows[i][2], font: MONO });
      }

      // Judgement pops
      for (let i = 0; i < g.judges.length; i++) {
        const j = g.judges[i];
        const k = j.t / j.life;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - k);
        g.text(j.text, j.x, j.y - k * 30, {
          size: 22, align: 'center', color: j.color, font: MONO, glow: j.color, blur: 18
        });
        ctx.restore();
      }

      if (g.health < 30 && !g.done) {
        const a = 0.075 + Math.sin(t * 6) * 0.045;
        const vg = ctx.createRadialGradient(480, 300, 180, 480, 300, 570);
        vg.addColorStop(0, 'rgba(251,113,133,0)');
        vg.addColorStop(1, 'rgba(251,113,133,' + a + ')');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      }

      const vg = ctx.createRadialGradient(480, 300, 230, 480, 300, 650);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(4,1,3,.58)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }
  });
})();
</script>
</body>
</html>
