<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Pulse Pong · WristLab Arcade</title>
</head>
<body>
<script src="./engine.js"></script>
<script>
(function () {
  const W = 960, H = 600;
  const TOP = 44, BOT = H - 24, LEFT = 34, RIGHT = W - 34;
  const WIN = 7;

  WristGame.mount({
    id: 'pulse-pong',
    title: 'Pulse Pong',
    tagline: 'The original duel, with a heartbeat.',
    category: 'Arcade',
    accent: '#6be8ff',
    bg: '#050b10',
    controls: [
      { keys: '↑ ↓', label: 'PADDLE' },
      { keys: 'WATCH', label: 'LEFT / RIGHT' }
    ],
    tips: [
      'Move the mouse or drag on the field to steer too.',
      'First to 7 points. The ball accelerates on every return.'
    ],

    init(g) {
      g.score = 0;
      g.player = { x: LEFT + 10, y: H / 2, w: 14, h: 104, vy: 0 };
      g.ai = { x: RIGHT - 24, y: H / 2, w: 14, h: 104, vy: 0 };
      g.ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 9, speed: 430 };
      g.ptsP = 0; g.ptsA = 0;
      g.serveTimer = 0.7;
      g.rally = 0;
      g.trail = [];
      g.lastScorer = null;
      g.aiTarget = H / 2;
      g.aiThink = 0;
      g.flash = 0;
      g.audio.stopMusic();
      serve(g, Math.random() > 0.5 ? 1 : -1);
    },

    onStart(g) {
      g.audio.startMusic({ root: 164, bpm: 118, scale: [0, 3, 7, 10, 12], wave: 'square', gain: 0.032 });
    },

    onAction(g, action, down) {
      if (action === 'left' || action === 'up') g.keys.add('up');
      if (action === 'right' || action === 'down') g.keys.add('down');
      if (!down) {
        if (action === 'left' || action === 'up') g.keys.delete('up');
        if (action === 'right' || action === 'down') g.keys.delete('down');
      }
    },

    onPointer(g, x, y, type) {
      if (type === 'move' || type === 'drag' || type === 'down') {
        g.player.y += (y - g.player.y) * 0.55;
      }
    },

    update(g, dt) {
      const p = g.player, ai = g.ai, b = g.ball;
      const up = g.pressed('up'), down = g.pressed('down');
      const spd = 620;
      if (up) p.y -= spd * dt;
      if (down) p.y += spd * dt;
      p.y = g.clamp(p.y, TOP + p.h / 2, BOT - p.h / 2);

      // AI: track with reaction delay + error, harder as the rally grows
      g.aiThink -= dt;
      if (g.aiThink <= 0) {
        g.aiThink = 0.085 - Math.min(0.045, g.rally * 0.002);
        const err = g.rand(-42, 42) * Math.max(0.25, 1 - g.rally * 0.08);
        g.aiTarget = b.vx > 0 ? b.y + err : H / 2 + g.rand(-60, 60);
      }
      const aiSpeed = 420 + Math.min(260, g.rally * 22);
      if (Math.abs(ai.y - g.aiTarget) > 6) ai.y += Math.sign(g.aiTarget - ai.y) * aiSpeed * dt;
      ai.y = g.clamp(ai.y, TOP + ai.h / 2, BOT - ai.h / 2);

      if (g.serveTimer > 0) {
        g.serveTimer -= dt;
        b.x += (W / 2 - b.x) * Math.min(1, dt * 8);
        b.y += (H / 2 - b.y) * Math.min(1, dt * 8);
        if (g.serveTimer <= 0) {
          const dir = g.lastScorer === 'ai' ? 1 : -1;
          b.vx = dir * b.speed;
          b.vy = g.rand(-220, 220);
          g.audio.sfx('blip');
        }
      } else {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        g.trail.push({ x: b.x, y: b.y, life: 0.22 });
        if (g.trail.length > 26) g.trail.shift();

        if (b.y - b.r < TOP) { b.y = TOP + b.r; b.vy = Math.abs(b.vy); g.audio.sfx('tick'); g.burst(b.x, b.y, '#6be8ff', 6, { speed: 90, life: 0.35, size: 2 }); }
        if (b.y + b.r > BOT) { b.y = BOT - b.r; b.vy = -Math.abs(b.vy); g.audio.sfx('tick'); g.burst(b.x, b.y, '#6be8ff', 6, { speed: 90, life: 0.35, size: 2 }); }

        // player paddle
        if (b.vx < 0 && b.x - b.r < p.x + p.w && b.x + b.r > p.x && b.y > p.y - p.h / 2 - b.r && b.y < p.y + p.h / 2 + b.r) {
          b.x = p.x + p.w + b.r;
          hitPaddle(g, p, 1);
        }
        // ai paddle
        if (b.vx > 0 && b.x + b.r > ai.x && b.x - b.r < ai.x + ai.w && b.y > ai.y - ai.h / 2 - b.r && b.y < ai.y + ai.h / 2 + b.r) {
          b.x = ai.x - b.r;
          hitPaddle(g, ai, -1);
        }

        if (b.x < LEFT - 20) point(g, 'ai');
        else if (b.x > RIGHT + 20) point(g, 'player');
      }

      if (g.flash > 0) g.flash -= dt;
    },

    draw(g, ctx) {
      g.clear('#050b10');
      const bg = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 620);
      bg.addColorStop(0, 'rgba(20,60,80,.28)');
      bg.addColorStop(1, 'rgba(3,7,10,0)');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      g.grid('rgba(107,232,255,.045)', 48);

      // big faded score
      ctx.save();
      ctx.globalAlpha = 0.06;
      g.text(String(g.ptsP), W / 2 - 150, H / 2 + 70, { size: 230, align: 'center', color: '#6be8ff', font: "'IBM Plex Mono',monospace" });
      g.text(String(g.ptsA), W / 2 + 150, H / 2 + 70, { size: 230, align: 'center', color: '#ff5f8f', font: "'IBM Plex Mono',monospace" });
      ctx.restore();

      // center line
      ctx.save();
      ctx.setLineDash([10, 16]);
      ctx.strokeStyle = 'rgba(107,232,255,.18)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(W / 2, TOP); ctx.lineTo(W / 2, BOT); ctx.stroke();
      ctx.restore();

      // field border
      g.roundRect(LEFT - 8, TOP - 8, RIGHT - LEFT + 16, BOT - TOP + 16, 12, null, 'rgba(107,232,255,.12)', 1);

      // scores
      g.text('YOU', W / 2 - 80, 34, { size: 11, align: 'right', color: '#7b8794', font: "'IBM Plex Mono',monospace" });
      g.text('CPU', W / 2 + 80, 34, { size: 11, align: 'left', color: '#7b8794', font: "'IBM Plex Mono',monospace" });
      g.text(String(g.ptsP), W / 2 - 30, 38, { size: 26, align: 'right', color: '#6be8ff', font: "'IBM Plex Mono',monospace" });
      g.text(String(g.ptsA), W / 2 + 30, 38, { size: 26, align: 'left', color: '#ff5f8f', font: "'IBM Plex Mono',monospace" });

      // trail
      for (let i = 0; i < g.trail.length; i++) {
        const t = g.trail[i];
        const a = (i / g.trail.length) * 0.5;
        g.circle(t.x, t.y, g.ball.r * (0.3 + i / g.trail.length * 0.7), `rgba(107,232,255,${a})`);
      }

      // paddles
      drawPaddle(g, g.player, '#6be8ff');
      drawPaddle(g, g.ai, '#ff5f8f');

      // ball
      g.glow(g.ball.x, g.ball.y, g.ball.r, '#eaffff', 26);
      g.circle(g.ball.x, g.ball.y, g.ball.r, '#d9fbff');
      g.circle(g.ball.x - 2, g.ball.y - 2, 2.4, '#ffffff');

      if (g.flash > 0) {
        ctx.fillStyle = `rgba(107,232,255,${g.flash * 0.35})`;
        ctx.fillRect(0, 0, W, H);
      }

      // serve hint
      if (g.serveTimer > 0 && g.ptsP + g.ptsA === 0) {
        g.text('FIRST TO 7', W / 2, H - 34, { size: 11, align: 'center', color: 'rgba(107,232,255,.5)', font: "'IBM Plex Mono',monospace" });
      }
    }
  });

  function drawPaddle(g, p, color) {
    g.roundRect(p.x, p.y - p.h / 2, p.w, p.h, p.w / 2, color);
    g.roundRect(p.x + 3, p.y - p.h / 2 + 5, 3, p.h - 10, 2, 'rgba(255,255,255,.55)');
  }

  function hitPaddle(g, paddle, dir) {
    const b = g.ball;
    const off = g.clamp((b.y - paddle.y) / (paddle.h / 2), -1, 1);
    b.speed = Math.min(880, b.speed + 26);
    const a = off * 0.9;
    b.vx = dir * Math.cos(a) * b.speed;
    b.vy = Math.sin(a) * b.speed;
    g.rally++;
    g.flash = 0.12;
    g.audio.sfx('tick');
    g.audio.tone(220 + Math.abs(off) * 120, 0.05, 'square', 0.08);
    g.burst(b.x, b.y, dir > 0 ? '#6be8ff' : '#ff5f8f', 10, { speed: 160, life: 0.45, size: 2.5 });
    g.haptic('tick');
  }

  function point(g, who) {
    if (who === 'player') { g.ptsP++; g.score += 100; g.audio.sfx('coin'); g.haptic('coin'); g.flash = 0.3; }
    else { g.ptsA++; g.audio.sfx('hit'); g.haptic('hit'); g.shake(5, 0.25); }
    g.lastScorer = who;
    g.rally = 0;
    g.trail.length = 0;
    g.ball.speed = 430;
    g.serveTimer = 0.75;
    if (g.ptsP >= WIN) { g.score += 500; g.over('You won ' + g.ptsP + '–' + g.ptsA + ' · Best ' + Math.max(g.best, g.score)); }
    else if (g.ptsA >= WIN) { g.over('CPU won ' + g.ptsA + '–' + g.ptsP + ' · Best ' + Math.max(g.best, g.score)); }
  }

  function serve(g, dir) {
    const b = g.ball;
    b.x = W / 2; b.y = H / 2;
    b.vx = 0; b.vy = 0;
    g.serveTimer = 0.7;
    g.lastScorer = dir > 0 ? 'ai' : 'player';
  }
})();
</script>
</body>
</html>
